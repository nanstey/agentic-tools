name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Runs the offline test scripts that need no installed harness. The two
# harness/pi/tests/*.test.mjs files are excluded: they need an installed Pi SDK
# and Pi packages, which a clean runner does not have.
jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: installer
            run: bash install/tests/install.test.sh
          - name: pi package patches
            run: bash harness/pi/tests/package-patches.test.sh
          - name: pi-improve
            run: bash harness/pi/tests/pi-improve.test.sh
    steps:
      - uses: actions/checkout@v4
      # package-patches.test.sh uses node:module stripTypeScriptTypes (Node 22.13+).
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: ${{ matrix.run }}
